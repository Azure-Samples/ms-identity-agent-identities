name: Build .NET (CustomerServiceAgent)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet/CustomerServiceAgent

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Install Aspire
        run: dotnet workload install aspire
        
      - name: Restore
        run: dotnet restore CustomerServiceAgent.sln

      - name: Build (Release)
        run: dotnet build CustomerServiceAgent.sln --configuration Release --no-restore
