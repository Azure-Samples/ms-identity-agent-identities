name: Build .NET (CustomerServiceAgent)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet/CustomerServiceAgent

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install Aspire
        run: dotnet workload install aspire
        
      - name: Restore
        run: dotnet restore CustomerServiceAgent.sln

      - name: Build (Release)
        run: dotnet build CustomerServiceAgent.sln --configuration Release --no-restore
